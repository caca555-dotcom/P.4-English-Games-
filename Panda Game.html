    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            min-height: 100vh;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border: 4px solid #4ade80;
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.15), 0 0 0 6px rgba(255, 255, 255, 0.5);
        }

        .btn-option {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 6px 0 #0d9488;
        }
        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0d9488;
        }

        .btn-freq {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 6px 0 #d97706;
        }
        .btn-freq:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d97706;
        }

        @keyframes pandaBounce {
            0%, 100% { transform: translateY(0) scale(var(--panda-scale, 1)); }
            50% { transform: translateY(-8px) scale(var(--panda-scale, 1)); }
        }

        @keyframes pandaChew {
            0% { transform: scale(var(--panda-scale, 1)) rotate(0deg); }
            25% { transform: scale(calc(var(--panda-scale, 1) * 1.08)) rotate(-3deg); }
            50% { transform: scale(calc(var(--panda-scale, 1) * 0.96)) rotate(3deg); }
            75% { transform: scale(calc(var(--panda-scale, 1) * 1.05)) rotate(-2deg); }
            100% { transform: scale(var(--panda-scale, 1)) rotate(0deg); }
        }

        @keyframes pandaShrink {
            0% { transform: scale(1.1) rotate(0deg); }
            50% { transform: scale(0.85) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animate-chew {
            animation: pandaChew 0.5s ease-in-out 3;
        }

        .animate-shrink {
            animation: pandaShrink 0.5s ease-in-out 1;
        }

        .animate-idle {
            animation: pandaBounce 3s ease-in-out infinite;
        }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(5deg); }
        }

        .floating-food {
            animation: floatItem 2.5s ease-in-out infinite;
        }

        .flying-food {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.5, -0.2, 0.5, 1.2);
            font-size: 3rem;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <script>
        // Web Audio Synthesizer
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'eat') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.08);
                    osc.frequency.setValueAtTime(250, now + 0.09);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.18);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.linearRampToValueAtTime(160, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.3, now + idx * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                        o.start(now + idx * 0.12);
                        o.stop(now + idx * 0.12 + 0.28);
                    });
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

                case 'magazines':
                    // Clear cartoon picture showing child reading a magazine

                default:

        // Helper to get activity icon for calendar
        function getActivityEmoji(key) {
            const map = {
                'ice-skating': '⛸️',
                'tennis': '🎾',
                'cycling': '🚲',
                'volleyball': '🏐',
                'rock-climbing': '🧗',
                'online-games': '🎮',
                'library': '📚',
                'magazines': '📖'
            };
            return map[key] || '⭐';
        }

        // Calendar HTML Renderer with Standard Monthly Layout
        // Weekdays arranged horizontally across the top: Mon | Tue | Wed | Thu | Fri | Sat | Sun
        // Repeated activities stack vertically under the same weekday column across weeks:
        // Always = 4 activity dates vertically in the same weekday column
        // Often = 3 activity dates vertically in the same weekday column
        // Sometimes = 2 activity dates vertically in the same weekday column
        function renderCalendarHTML(activeDaysCount, activityKey) {
            const icon = getActivityEmoji(activityKey);
            
            // Map activeDaysCount to repeated dates down a specific weekday column
            // Day 1 = Mon, Day 2 = Tue, Day 3 = Wed, Day 4 = Thu, Day 5 = Fri, Day 6 = Sat, Day 7 = Sun
            let selectedDays = [];
            
            if (activityKey === 'tennis') {
                // Tuesday column (Days 2, 9, 16) -> 3 days = Often
                selectedDays = [2, 9, 16];
            } else if (activityKey === 'volleyball') {
                // Thursday column (Days 4, 11, 18, 25) -> 4 days = Always
                selectedDays = [4, 11, 18, 25];
            } else if (activityKey === 'online-games') {
                // Friday column (Days 5, 12) -> 2 days = Sometimes
                selectedDays = [5, 12];
            } else if (activityKey === 'library') {
                // Wednesday column (Days 3, 10, 17) -> 3 days = Often
                selectedDays = [3, 10, 17];
            } else {
                // Default fallback based on activeDaysCount
                if (activeDaysCount === 4) selectedDays = [2, 9, 16, 23];
                else if (activeDaysCount === 3) selectedDays = [2, 9, 16];
                else if (activeDaysCount === 2) selectedDays = [2, 9];
            }

            const dayHeaders = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            let headersHTML = dayHeaders.map(day => `
                <div class="py-1 font-bold text-emerald-900 text-xs sm:text-sm text-center bg-emerald-200/80 rounded-md">
                    ${day}
                </div>
            `).join('');

            let daysGridHTML = '';
            // Render 28 calendar date cells in 7 columns
            for (let dayNum = 1; dayNum <= 28; dayNum++) {
                const isActive = selectedDays.includes(dayNum);
                daysGridHTML += `
                    <div class="h-8 sm:h-10 flex items-center justify-center border ${isActive ? 'border-amber-500 bg-amber-100 shadow-sm' : 'border-emerald-200 bg-white'} rounded-md relative text-xs sm:text-sm text-slate-700">
                        <span class="absolute top-0.5 left-1 text-[8px] sm:text-[10px] text-slate-400 font-semibold">${dayNum}</span>
                        ${isActive ? `<span class="text-base sm:text-xl animate-bounce">${icon}</span>` : ''}
                    </div>
                `;
            }

            return `
                <div class="w-full max-w-sm bg-emerald-50/90 border-2 border-emerald-400 rounded-2xl p-2 sm:p-3 shadow-sm">
                    <!-- Standard Mon-Sun Weekday Header Row -->
                    <div class="grid grid-cols-7 gap-1 mb-1">
                        ${headersHTML}
                    </div>
                    <!-- Calendar Dates Grid (7 columns) -->
                    <div class="grid grid-cols-7 gap-1">
                        ${daysGridHTML}
                    </div>
                </div>
            `;
        }

        // Dynamic Panda SVG Renderer (Scale changes dynamically based on score: 0 = slim to 8 = round & full)
        function renderPandaSVG(level) {
            const ratio = level / 8; // 0 to 1
            
            const bodyWidth = 110 + ratio * 85;   
            const bodyHeight = 100 + ratio * 75;  
            const tummyRadius = 38 + ratio * 42;  
            const cheekSize = 10 + ratio * 8;     
            const isFull = level === 8;

            return `
            <svg viewBox="0 0 240 240" class="w-full h-full drop-shadow-xl" style="--panda-scale: 1;">
                <!-- Ground Shadow -->
                <ellipse cx="120" cy="215" rx="${60 + ratio * 45}" ry="${12 + ratio * 8}" fill="rgba(0,0,0,0.15)"/>

                <!-- Panda Ears -->
                <circle cx="${120 - 45 - ratio * 10}" cy="${70 - ratio * 5}" r="${22 + ratio * 4}" fill="#1e293b"/>
                <circle cx="${120 + 45 + ratio * 10}" cy="${70 - ratio * 5}" r="${22 + ratio * 4}" fill="#1e293b"/>
                <circle cx="${120 - 45 - ratio * 10}" cy="${70 - ratio * 5}" r="${12 + ratio * 2}" fill="#475569"/>
                <circle cx="${120 + 45 + ratio * 10}" cy="${70 - ratio * 5}" r="${12 + ratio * 2}" fill="#475569"/>

                <!-- Panda Body -->
                <ellipse cx="120" cy="${155 + ratio * 5}" rx="${bodyWidth / 2}" ry="${bodyHeight / 2}" fill="#ffffff" stroke="#1e293b" stroke-width="6"/>

                <!-- Tummy Area -->
                <ellipse cx="120" cy="${160 + ratio * 5}" rx="${tummyRadius}" ry="${tummyRadius * 0.85}" fill="#f1f5f9"/>

                ${isFull ? `
                    <text x="75" y="150" font-size="20">✨</text>
                    <text x="155" y="155" font-size="20">✨</text>
                ` : ''}

                <!-- Paws -->
                <ellipse cx="${120 - bodyWidth/2.8}" cy="${150 + ratio*10}" rx="18" ry="14" fill="#1e293b" transform="rotate(-15 ${120 - bodyWidth/2.8} ${150 + ratio*10})"/>
                <ellipse cx="${120 + bodyWidth/2.8}" cy="${150 + ratio*10}" rx="18" ry="14" fill="#1e293b" transform="rotate(15 ${120 + bodyWidth/2.8} ${150 + ratio*10})"/>

                <!-- Feet -->
                <ellipse cx="${120 - tummyRadius + 5}" cy="${205 + ratio * 2}" rx="20" ry="15" fill="#1e293b"/>
                <ellipse cx="${120 + tummyRadius - 5}" cy="${205 + ratio * 2}" rx="20" ry="15" fill="#1e293b"/>
                <circle cx="${120 - tummyRadius + 5}" cy="${205 + ratio * 2}" r="7" fill="#f472b6"/>
                <circle cx="${120 + tummyRadius - 5}" cy="${205 + ratio * 2}" r="7" fill="#f472b6"/>

                <!-- Head -->
                <ellipse cx="120" cy="95" rx="${55 + ratio * 8}" ry="${48 + ratio * 6}" fill="#ffffff" stroke="#1e293b" stroke-width="6"/>

                <!-- Eye Patches -->
                <ellipse cx="98" cy="92" rx="16" ry="20" fill="#1e293b" transform="rotate(-12 98 92)"/>
                <ellipse cx="142" cy="92" rx="16" ry="20" fill="#1e293b" transform="rotate(12 142 92)"/>

                <!-- Eyes -->
                ${isFull ? `
                    <path d="M 90 92 Q 98 82 106 92" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 134 92 Q 142 82 150 92" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
                ` : `
                    <circle cx="100" cy="92" r="6" fill="#ffffff"/>
                    <circle cx="102" cy="90" r="2.5" fill="#1e293b"/>
                    <circle cx="140" cy="92" r="6" fill="#ffffff"/>
                    <circle cx="138" cy="90" r="2.5" fill="#1e293b"/>
                `}

                <!-- Cheeks -->
                <circle cx="82" cy="108" r="${cheekSize}" fill="#f472b6" opacity="${0.4 + ratio * 0.4}"/>
                <circle cx="158" cy="108" r="${cheekSize}" fill="#f472b6" opacity="${0.4 + ratio * 0.4}"/>

                <!-- Nose & Smile -->
                <ellipse cx="120" cy="104" rx="7" ry="5" fill="#1e293b"/>
                ${isFull ? `
                    <path d="M 108 112 Q 120 128 132 112" stroke="#1e293b" stroke-width="4" fill="#ef4444" stroke-linecap="round"/>
                ` : `
                    <path d="M 112 112 Q 120 120 128 112" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                `}
            </svg>`;
        }

        function updateFoodTracker() {
            const tracker = document.getElementById('foodTracker');
            tracker.innerHTML = '';

            FOOD_ITEMS.forEach((food, idx) => {
                const isEaten = idx < score;
                const isCurrent = idx === score;

                const slot = document.createElement('div');
                slot.id = `food-slot-${idx}`;
                slot.className = `flex flex-col items-center justify-center p-1 sm:p-2 rounded-xl transition-all ${
                    isEaten 
                        ? 'bg-emerald-200 border-2 border-emerald-500 scale-95 opacity-80' 
                        : isCurrent 
                            ? 'bg-amber-100 border-2 border-amber-500 scale-110 floating-food' 
                            : 'bg-slate-100 border-2 border-slate-300 opacity-50'
                }`;

                slot.innerHTML = `
                    <span class="text-2xl sm:text-3xl">${food.icon}</span>
                    <span class="text-[10px] sm:text-xs font-bold ${isEaten ? 'text-emerald-800' : 'text-slate-600'}">
                        ${isEaten ? '✓ Eaten' : food.name}
                    </span>
                `;
                tracker.appendChild(slot);
            });
        }

        function loadQuestion() {
            if (currentQuestion >= QUESTIONS.length) {
                showVictory();
                return;
            }

            isTransitioning = false;
            document.getElementById('qIndex').textContent = currentQuestion + 1;
            
            // Update Panda Visual
            const pandaContainer = document.getElementById('pandaVisualContainer');
            pandaContainer.innerHTML = renderPandaSVG(score);

            // Update Food Tracker
            updateFoodTracker();

            // Update Speech Bubble
            const bubble = document.getElementById('pandaBubble');
            if (score === 0) {
                bubble.textContent = "I'm hungry! Please answer to feed me!";
            } else {
                const phrases = [
                    "Yummy! I want another snack!",
                    "Munch munch! Getting a little rounder!",
                    "Delicious! Keep going!",
                    "Ooh, my tummy is growing!",
                    "So tasty! I'm getting big!",
                    "Yum yum! Almost full!",
                    "One more treat please!"
                ];
                bubble.textContent = phrases[score - 1] || "Yummy! More please!";
            }

            // Clear feedback box completely so no previous text remains
            const feedbackText = document.getElementById('feedbackText');
            feedbackText.textContent = '';
            feedbackText.className = "text-lg sm:text-xl font-extrabold opacity-0 transition-opacity duration-300";

            const q = QUESTIONS[currentQuestion];
            const contentArea = document.getElementById('questionContent');
            const answersContainer = document.getElementById('answersContainer');

            contentArea.innerHTML = '';
            answersContainer.innerHTML = '';

            if (q.type === 1) {
                // Type 1: Vocabulary
                contentArea.innerHTML = `
                    <div class="mb-1">
                        ${getActivitySVG(q.activityKey)}
                    </div>
                    <h2 class="text-lg sm:text-2xl font-bold text-emerald-900 leading-snug">
                        ${q.questionText}
                    </h2>
                `;

                q.options.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.className = "btn-option w-full py-3 px-4 bg-teal-500 hover:bg-teal-600 text-white font-bold text-base sm:text-xl rounded-2xl border-2 border-teal-700 text-left transition-transform";
                    btn.textContent = optText;
                    btn.onclick = () => handleAnswer(index === q.correctIndex, btn);
                    answersContainer.appendChild(btn);
                });

            } else if (q.type === 2) {
                // Type 2: Frequency (Always, Often, Sometimes buttons only)
                contentArea.innerHTML = `
                    <div class="mb-1 w-full flex justify-center">
                        ${renderCalendarHTML(q.activeDaysCount, q.activityKey)}
                    </div>
                    <h2 class="text-lg sm:text-2xl font-bold text-amber-900 leading-snug">
                        ${q.questionText}
                    </h2>
                `;

                const freqOptions = ['Always', 'Often', 'Sometimes'];
                freqOptions.forEach((freqWord) => {
                    const btn = document.createElement('button');
                    btn.className = "btn-freq w-full py-3 px-4 bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg sm:text-2xl rounded-2xl border-2 border-amber-700 text-center transition-transform";
                    btn.textContent = freqWord;
                    btn.onclick = () => handleAnswer(freqWord === q.correctFrequency, btn, q.fullSentence);
                    answersContainer.appendChild(btn);
                });
            }
        }

        function handleAnswer(isCorrect, btnElement, fullSentence = '') {
            if (isTransitioning) return;

            const feedbackText = document.getElementById('feedbackText');

            if (isCorrect) {
                isTransitioning = true;
                playSound('correct');

                // Simple clean encouraging feedback string
                const praises = ["Great!", "Good job!", "Excellent!", "Awesome!"];
                const praise = praises[Math.floor(Math.random() * praises.length)];
                feedbackText.textContent = fullSentence ? `${praise} ${fullSentence}` : praise;
                feedbackText.className = "text-lg sm:text-xl font-extrabold text-emerald-600 opacity-100 animate-bounce";

                btnElement.classList.remove('bg-teal-500', 'bg-amber-500');
                btnElement.classList.add('bg-emerald-600', 'ring-4', 'ring-emerald-300');

                // Animate flying food and increase panda size
                animateFoodToPanda(() => {
                    score++;
                    currentQuestion++;
                    
                    playSound('eat');
                    const pandaVis = document.getElementById('pandaVisualContainer');
                    pandaVis.classList.add('animate-chew');

                    setTimeout(() => {
                        pandaVis.classList.remove('animate-chew');
                        // Hide and completely wipe previous feedback before loading the next question
                        feedbackText.textContent = '';
                        feedbackText.className = "text-lg sm:text-xl font-extrabold opacity-0 transition-opacity duration-300";
                        loadQuestion();
                    }, 800);
                });

            } else {
                playSound('wrong');
                
                // If incorrect answer: Panda shrinks / loses 1 food size if score > 0!
                if (score > 0) {
                    score--;
                    updateFoodTracker();
                    
                    const pandaVis = document.getElementById('pandaVisualContainer');
                    pandaVis.innerHTML = renderPandaSVG(score);
                    pandaVis.classList.add('animate-shrink');
                    setTimeout(() => pandaVis.classList.remove('animate-shrink'), 500);

                    const bubble = document.getElementById('pandaBubble');
                    bubble.textContent = "Oops! I got a little thinner! Try again!";
                }

                // Display clear retry feedback
                feedbackText.textContent = "Try again!";
                feedbackText.className = "text-lg sm:text-xl font-bold text-rose-500 opacity-100";

                btnElement.classList.add('translate-x-2');
                setTimeout(() => btnElement.classList.remove('translate-x-2'), 150);
            }
        }

        function animateFoodToPanda(callback) {
            const currentSlot = document.getElementById(`food-slot-${score}`);
            const pandaContainer = document.getElementById('pandaVisualContainer');

            if (!currentSlot || !pandaContainer) {
                callback();
                return;
            }

            const slotRect = currentSlot.getBoundingClientRect();
            const pandaRect = pandaContainer.getBoundingClientRect();

            const flyer = document.createElement('div');
            flyer.className = 'flying-food';
            flyer.textContent = FOOD_ITEMS[score].icon;
            flyer.style.left = `${slotRect.left + slotRect.width / 4}px`;
            flyer.style.top = `${slotRect.top}px`;

            document.body.appendChild(flyer);

            flyer.getBoundingClientRect(); // Force layout reflow

            const targetX = pandaRect.left + pandaRect.width / 2 - 20;
            const targetY = pandaRect.top + pandaRect.height / 2 - 10;

            flyer.style.left = `${targetX}px`;
            flyer.style.top = `${targetY}px`;
            flyer.style.transform = 'scale(1.8) rotate(360deg)';

            setTimeout(() => {
                flyer.remove();
                callback();
            }, 700);
        }

        function showVictory() {
            playSound('victory');

            document.getElementById('gameContainer').classList.add('hidden');
            const victoryScreen = document.getElementById('victoryScreen');
            victoryScreen.classList.remove('hidden');

            document.getElementById('finalPandaVisual').innerHTML = renderPandaSVG(8);

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } });
                }, 400);
            }
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('victoryScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            loadQuestion();
        }

        window.onload = function() {
            loadQuestion();
        };
    </script>
